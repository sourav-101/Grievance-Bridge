<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t">
  <title id="t">Government schemes for workers: ID card, savings, insurance and health</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="0.55" stop-color="#f6f4ef"/>
      <stop offset="1" stop-color="#e6f4f1"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155e75"/>
      <stop offset="1" stop-color="#0b2c3f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1c2733" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- soft background shapes -->
  <circle cx="1380" cy="140" r="260" fill="#14b8a6" opacity="0.10"/>
  <circle cx="190" cy="760" r="300" fill="#f59e0b" opacity="0.12"/>
  <circle cx="820" cy="430" r="330" fill="#ffffff" opacity="0.7"/>
  <g fill="#0f766e" opacity="0.16">
    <circle cx="300" cy="170" r="7"/><circle cx="345" cy="170" r="7"/><circle cx="390" cy="170" r="7"/>
    <circle cx="300" cy="215" r="7"/><circle cx="345" cy="215" r="7"/><circle cx="390" cy="215" r="7"/>
    <circle cx="1210" cy="690" r="7"/><circle cx="1255" cy="690" r="7"/><circle cx="1300" cy="690" r="7"/>
    <circle cx="1210" cy="735" r="7"/><circle cx="1255" cy="735" r="7"/><circle cx="1300" cy="735" r="7"/>
  </g>

  <!-- worker ID card (e-Shram) -->
  <g filter="url(#shadow)" transform="rotate(-6 760 420)">
    <rect x="520" y="240" width="520" height="330" rx="34" fill="#ffffff"/>
    <rect x="520" y="240" width="520" height="92" rx="34" fill="url(#teal)"/>
    <rect x="520" y="300" width="520" height="32" fill="url(#teal)"/>
    <circle cx="580" cy="286" r="16" fill="#fcd34d"/>
    <rect x="612" y="274" width="170" height="24" rx="12" fill="#ffffff" opacity="0.85"/>
    <!-- photo -->
    <rect x="566" y="364" width="132" height="160" rx="20" fill="#e6f4f1"/>
    <circle cx="632" cy="424" r="34" fill="#0f766e"/>
    <path d="M578 512c8-44 34-62 54-62s46 18 54 62z" fill="#0f766e"/>
    <!-- details -->
    <rect x="728" y="372" width="250" height="22" rx="11" fill="#1c2733" opacity="0.85"/>
    <rect x="728" y="414" width="190" height="18" rx="9" fill="#5b6675" opacity="0.45"/>
    <rect x="728" y="450" width="220" height="18" rx="9" fill="#5b6675" opacity="0.45"/>
    <rect x="728" y="490" width="120" height="34" rx="10" fill="#fef3c7"/>
    <rect x="742" y="502" width="92" height="10" rx="5" fill="#b45309" opacity="0.8"/>
  </g>

  <!-- ₹ coin (wages, pension) -->
  <g filter="url(#shadow)">
    <circle cx="1130" cy="300" r="118" fill="url(#gold)"/>
    <circle cx="1130" cy="300" r="94" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.65"/>
    <path d="M1086 248h92M1086 280h92M1094 248c58 0 58 64 0 64h-8l76 78" fill="none" stroke="#7c2d12" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- insurance shield -->
  <g filter="url(#shadow)">
    <path d="M330 300l130-52 130 52v96c0 92-56 156-130 186-74-30-130-94-130-186z" fill="url(#ocean)"/>
    <path d="M402 418l42 42 86-90" fill="none" stroke="#fcd34d" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- health heart (Ayushman) -->
  <g filter="url(#shadow)">
    <path d="M1180 600c0-40 32-70 70-70 26 0 46 12 58 32 12-20 32-32 58-32 38 0 70 30 70 70 0 70-128 140-128 140s-128-70-128-140z" fill="#ffffff"/>
    <path d="M1226 616h50l20-38 30 76 22-38h44" fill="none" stroke="#0f766e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- small floating coins -->
  <circle cx="1010" cy="140" r="30" fill="url(#gold)" opacity="0.9"/>
  <circle cx="1310" cy="470" r="22" fill="url(#gold)" opacity="0.85"/>
  <circle cx="260" cy="560" r="26" fill="url(#teal)" opacity="0.8"/>
</svg>
